<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src ws: wss:"
    />
    <title>Remote Desk</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="renderer.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="5" width="26" height="17" rx="3" fill="currentColor" />
          <rect x="11" y="24" width="10" height="3" rx="1.5" fill="currentColor" opacity=".5" />
          <path d="M13.5 8.5v8.5l2-1.8 1.4 2.9 1.3-.6-1.4-2.8 2.7-.2z" fill="#fff" />
        </svg>
        <span>Remote Desk</span>
      </div>
      <div class="topbar-actions">
        <span class="status-pill" id="status-pill"><span class="dot"></span><span id="status-text"></span></span>
        <button class="icon-button" data-nav="settings" data-i18n-title="nav.settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar">
        <button class="pill-button" id="sidebar-connect" data-i18n="nav.connectButton"></button>
        <ul class="nav">
          <li>
            <button class="nav-item active" data-nav="home">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
              <span data-i18n="nav.home"></span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-nav="settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" /></svg>
              <span data-i18n="nav.settings"></span>
            </button>
          </li>
          <li class="mac-only">
            <button class="nav-item" data-nav="permissions">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
              <span data-i18n="nav.permissions"></span>
            </button>
          </li>
        </ul>

        <div class="sidebar-footer">
          <div class="section-label" data-i18n="sidebar.connection"></div>
          <div class="network">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
            <div>
              <div id="network-name"></div>
              <div class="network-detail" id="network-detail"></div>
            </div>
          </div>
          <div class="version" id="version"></div>
        </div>
      </nav>

      <main class="content">
        <!-- Home -->
        <section class="page" id="page-home">
          <div class="page-header">
            <h1 data-i18n="nav.home"></h1>
          </div>

          <div class="banner" id="permission-banner" hidden>
            <span data-i18n="perm.banner"></span>
            <button class="small-button" data-nav="permissions" data-i18n="perm.setup"></button>
          </div>

          <div class="cards">
            <article class="card card-primary">
              <div class="card-label" data-i18n="host.label"></div>
              <h2 data-i18n="host.title"></h2>
              <div class="field-label" data-i18n="host.id"></div>
              <div class="value-row">
                <span class="big-value" id="my-id"></span>
                <button class="chip" data-copy="my-id" data-i18n="action.copy"></button>
              </div>
              <div class="field-label" data-i18n="host.password"></div>
              <div class="value-row">
                <span class="big-value mono" id="my-password"></span>
                <button class="chip" data-copy="my-password" data-i18n="action.copy"></button>
                <button class="chip icon-chip" id="new-password" data-i18n-title="host.newPassword">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5" /></svg>
                </button>
              </div>
              <p class="card-hint" data-i18n="host.hint"></p>
            </article>

            <article class="card card-light">
              <div class="card-label" data-i18n="viewer.label"></div>
              <h2 data-i18n="viewer.title"></h2>
              <form id="connect-form" autocomplete="off">
                <label class="field-label" for="partner-id" data-i18n="viewer.partnerId"></label>
                <input id="partner-id" inputmode="numeric" placeholder="123 456 789" required />
                <label class="field-label" for="partner-password" data-i18n="viewer.password"></label>
                <input id="partner-password" type="password" required />
                <div class="form-actions">
                  <button type="submit" class="primary-button" id="connect-button" data-i18n="viewer.connect"></button>
                  <button type="button" class="ghost-button" id="cancel-button" data-i18n="viewer.cancel" hidden></button>
                </div>
                <p class="form-status" id="connect-status" role="status"></p>
              </form>
            </article>
          </div>

          <h3 class="section-title" data-i18n="recent.title"></h3>
          <div class="table">
            <div class="table-head">
              <span data-i18n="recent.partner"></span>
              <span data-i18n="recent.last"></span>
              <span></span>
            </div>
            <div id="recent-list"></div>
            <p class="empty" id="recent-empty" data-i18n="recent.empty"></p>
          </div>
        </section>

        <!-- Settings -->
        <section class="page" id="page-settings" hidden>
          <div class="page-header">
            <h1 data-i18n="settings.title"></h1>
          </div>
          <form id="settings-form" class="settings" autocomplete="off">
            <div class="settings-group">
              <h3 class="section-title" data-i18n="settings.language"></h3>
              <select id="setting-language">
                <option value="auto" data-i18n="settings.languageAuto"></option>
                <option value="en">English</option>
                <option value="cs">Čeština</option>
              </select>
            </div>

            <div class="settings-group">
              <h3 class="section-title" data-i18n="settings.network"></h3>
              <p class="hint" data-i18n="settings.networkHint"></p>
              <label class="option">
                <input type="radio" name="network" value="public" />
                <span>
                  <strong data-i18n="settings.public"></strong>
                  <small data-i18n="settings.publicHint"></small>
                </span>
              </label>
              <label class="option">
                <input type="radio" name="network" value="own" />
                <span>
                  <strong data-i18n="settings.own"></strong>
                  <small data-i18n="settings.ownHint"></small>
                </span>
              </label>
              <div id="own-server-fields">
                <label class="field-label" for="setting-server" data-i18n="settings.serverUrl"></label>
                <input id="setting-server" placeholder="wss://relay.example.com" />
              </div>
            </div>

            <div class="settings-group">
              <h3 class="section-title" data-i18n="settings.turn"></h3>
              <p class="hint" data-i18n="settings.turnHint"></p>
              <label class="field-label" for="setting-turn-url" data-i18n="settings.turnUrl"></label>
              <input id="setting-turn-url" placeholder="turn:turn.example.com:3478" />
              <div class="two-columns">
                <div>
                  <label class="field-label" for="setting-turn-user" data-i18n="settings.turnUsername"></label>
                  <input id="setting-turn-user" />
                </div>
                <div>
                  <label class="field-label" for="setting-turn-credential" data-i18n="settings.turnCredential"></label>
                  <input id="setting-turn-credential" type="password" />
                </div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="primary-button" data-i18n="settings.save"></button>
              <span class="form-status" id="settings-status" role="status"></span>
            </div>
          </form>
        </section>

        <!-- Permissions (macOS) -->
        <section class="page" id="page-permissions" hidden>
          <div class="page-header">
            <h1 data-i18n="perm.title"></h1>
          </div>
          <p class="hint wide" data-i18n="perm.hint"></p>
          <div class="table">
            <div class="permission-row">
              <div>
                <strong data-i18n="perm.screen"></strong>
                <small data-i18n="perm.screenHint"></small>
              </div>
              <span class="badge" id="perm-screen-status"></span>
              <button class="small-button" data-permission="screen" data-i18n="perm.open"></button>
            </div>
            <div class="permission-row">
              <div>
                <strong data-i18n="perm.accessibility"></strong>
                <small data-i18n="perm.accessibilityHint"></small>
              </div>
              <span class="badge" id="perm-accessibility-status"></span>
              <button class="small-button" data-permission="accessibility" data-i18n="perm.open"></button>
            </div>
          </div>
          <div class="form-actions">
            <button class="primary-button" id="relaunch" data-i18n="perm.restart"></button>
          </div>
        </section>
      </main>
    </div>

    <div class="host-banner" id="host-banner" hidden>
      <span data-i18n="session.banner"></span>
      <button id="host-disconnect" data-i18n="session.disconnect"></button>
    </div>

    <div class="viewer" id="viewer" hidden>
      <div class="viewer-stage" id="viewer-stage">
        <video id="remote-video" autoplay muted playsinline tabindex="0"></video>
      </div>
      <div class="viewer-drag"></div>

      <div class="toolbar" id="toolbar">
        <span class="toolbar-title" id="viewer-title"></span>
        <span class="conn" id="conn-info"><span class="dot"></span><span id="conn-text">…</span></span>
        <span class="toolbar-sep"></span>
        <button class="tool" id="tool-scale" data-i18n-title="toolbar.original">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" /></svg>
        </button>
        <button class="tool" id="tool-fullscreen" data-i18n-title="toolbar.fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" /></svg>
        </button>
        <div class="tool-menu">
          <button class="tool" id="tool-quality" data-i18n-title="toolbar.quality">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20a8 8 0 1 0-8-8M12 12l4-4" /><circle cx="12" cy="12" r="1.5" /></svg>
          </button>
          <div class="menu" id="menu-quality" hidden>
            <button data-quality="auto" data-i18n="quality.auto"></button>
            <button data-quality="speed" data-i18n="quality.speed"></button>
            <button data-quality="quality" data-i18n="quality.quality"></button>
          </div>
        </div>
        <button class="tool" id="tool-viewonly" data-i18n-title="toolbar.viewOnly">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
        </button>
        <div class="tool-menu">
          <button class="tool" id="tool-keys" data-i18n-title="toolbar.keys">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2" /><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10" /></svg>
          </button>
          <div class="menu" id="menu-keys" hidden></div>
        </div>
        <button class="tool" id="tool-screenshot" data-i18n-title="toolbar.screenshot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></svg>
        </button>
        <button class="tool" id="tool-pin" data-i18n-title="toolbar.pin">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z" /></svg>
        </button>
        <span class="toolbar-sep"></span>
        <button class="tool danger" id="viewer-disconnect" data-i18n-title="session.disconnect">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" /></svg>
        </button>
      </div>
    </div>
  </body>
</html>
