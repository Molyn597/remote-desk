name: Release

# Push a tag like v0.2.0 (matching app/package.json) to build and publish a release.
# Installed apps pick up the new version once the release is published.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop if this version was already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "$GITHUB_REF_NAME"; then
            echo "A release for $GITHUB_REF_NAME already exists. Bump the version for a new release."
            exit 1
          fi
      - name: Check tag matches app version
        run: |
          VERSION="v$(node -p "require('./app/package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $VERSION"
            exit 1
          fi
      - name: Take release notes from CHANGELOG.md
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const section = fs.readFileSync("CHANGELOG.md", "utf8").split(/^## /m).find((s) => s.startsWith("[" + version + "]"));
            if (!section) { console.error("CHANGELOG.md has no entry for " + version); process.exit(1); }
            fs.writeFileSync("notes.md", section.split("\n").slice(1).join("\n").trim() + "\n");
          ' "${GITHUB_REF_NAME#v}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --notes-file notes.md --title "Remote Desk $GITHUB_REF_NAME"

  build:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # macOS keeps permissions across updates only if every release is signed
      # with the same certificate (see "Signing" in README).
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "::error::Secrets MAC_CERT_P12_BASE64 and MAC_CERT_PASSWORD are required"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/"Remote Desk Signing"/ { print $2; exit }')
          [ -n "$IDENTITY" ] || { echo "::error::Signing identity not found"; exit 1; }
          echo "RD_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "RD_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm -w app run build && npm -w app exec -- electron-builder --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
